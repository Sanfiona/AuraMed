version: '3.8'

services:
  # Baza danych PostgreSQL
  db:
    image: postgres:15
    container_name: auramed_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: AuraMed3
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./baza_danych/baza_danych.sql:/docker-entrypoint-initdb.d/baza_danych.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Jednorazowy setup - import danych i trenowanie
  setup:
    build: .
    container_name: auramed_setup
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/AuraMed3
    volumes:
      - ./dane:/app/dane
      - ./baza_danych:/app/baza_danych
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Importowanie danych...' &&
        python baza_danych/skrypty_migracji/import_medications.py &&
        python baza_danych/skrypty_migracji/import_symptoms.py &&
        python baza_danych/skrypty_migracji/import_trening.py &&
        python baza_danych/skrypty_migracji/import_precautions.py &&
        python baza_danych/skrypty_migracji/import_diets.py &&
        echo 'Trenowanie modeli...' &&
        python train_model.py &&
        echo 'Setup zakończony!'
      "
    profiles:
      - setup

  # Aplikacja Streamlit
  app:
    build: .
    container_name: auramed_app
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/AuraMed3
    ports:
      - "8501:8501"
    volumes:
      - ./dane:/app/dane
      - ./baza_danych:/app/baza_danych
      - ./model_lr.pkl:/app/model_lr.pkl
      - ./model_rf.pkl:/app/model_rf.pkl
      - ./feature_ids.pkl:/app/feature_ids.pkl
      - ./feature_names.pkl:/app/feature_names.pkl
      - ./classes.pkl:/app/classes.pkl
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: